<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚙️ จัดการหมวดหมู่ - MyFamily Money</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>@import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap'); body { font-family: 'Kanit', sans-serif; background-color: #f8fafc; }</style>
</head>
<body class="min-h-screen p-4 pb-12 text-slate-800">
    <div class="max-w-md mx-auto space-y-5">
        <div class="flex items-center gap-3 mb-2"><button onclick="window.location.href='dashboard.html'" class="p-2 bg-white rounded-full shadow-sm text-slate-400 active:scale-90 transition">❮</button><h1 class="text-xl font-bold">⚙️ จัดการหมวดหมู่</h1></div>

        <div class="bg-white p-6 rounded-[2.5rem] shadow-sm border border-slate-50 space-y-4">
            <div class="grid grid-cols-2 gap-4">
                <div><label class="text-[10px] font-bold text-slate-400 uppercase ml-2">ถังเงิน (Account)</label>
                    <select id="acc" onchange="updateGroups()" class="w-full p-4 bg-slate-50 rounded-2xl border-none outline-none font-medium mt-1">
                        <option value="Circular">เงินหมุนเวียน</option>
                        <option value="Savings">เงินเก็บออม</option>
                    </select>
                </div>
                <div><label class="text-[10px] font-bold text-slate-400 uppercase ml-2">ประเภท (Type)</label>
                    <select id="type" onchange="updateGroups()" class="w-full p-4 bg-slate-50 rounded-2xl border-none outline-none font-medium mt-1">
                        <option value="Income">รายรับ</option>
                        <option value="Expense">รายจ่าย</option>
                    </select>
                </div>
            </div>
            
            <div><label class="text-[10px] font-bold text-slate-400 uppercase ml-2">กลุ่มหมวดหมู่หลัก (MAIN GROUP)</label>
                <select id="group" class="w-full p-4 bg-slate-50 rounded-2xl border-none outline-none font-medium mt-1"></select>
            </div>
            
            <div><label class="text-[10px] font-bold text-slate-400 uppercase ml-2">ระบุชื่อรายการย่อย</label>
                <input type="text" id="name" placeholder="เช่น เงินเดือน, ค่าเน็ต..." class="w-full p-4 bg-slate-50 rounded-2xl border-none outline-none font-bold text-slate-800 mt-1">
            </div>

            <button id="saveBtn" onclick="addCat()" class="w-full bg-blue-600 text-white py-4 rounded-[1.5rem] font-bold shadow-lg active:scale-95 transition-all">เพิ่มหมวดหมู่ตอนนี้</button>
        </div>
        
        <div class="pt-4"><h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest text-center mb-4">หมวดหมู่ปัจจุบัน</h3><div id="list" class="space-y-2"></div></div>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwS4cnZIW0Ntnnx7Qw4s50HY37YbsmeRcjpAFXZsj_5pkdoIZAqKY12lSGf27PW-eaUSA/exec";
        
        function updateGroups() {
            const acc = document.getElementById('acc').value, type = document.getElementById('type').value, g = document.getElementById('group');
            if(acc === 'Savings') {
                g.innerHTML = (type === 'Income') ? '<option value="ลงทุน">🏆 ลงทุน</option><option value="การศึกษา">🎓 การศึกษา</option><option value="สุขภาพ">🏥 สุขภาพ</option><option value="รางวัล">✈️ รางวัล</option>' : '<option value="ถอนลงทุน">📉 ถอนลงทุน</option><option value="จ่ายค่าเรียน">📚 จ่ายค่าเรียน</option><option value="จ่ายรักษาพยาบาล">🚑 จ่ายรักษาพยาบาล</option><option value="ใช้เงินรางวัล">🎁 ใช้เงินรางวัล</option>';
            } else {
                g.innerHTML = (type === 'Income') ? '<option value="งบต้นเดือน">📈 งบต้นเดือน</option><option value="รายได้หลัก">💰 รายได้หลัก</option><option value="รายได้พิเศษ">🧧 รายได้พิเศษ</option><option value="อื่นๆ">📦 อื่นๆ</option>' : '<option value="ใช้จ่ายส่วนตัว">🛒 ใช้จ่ายส่วนตัว</option><option value="จ่ายฟิกซ์คอร์ส">📋 จ่ายฟิกซ์คอร์ส</option><option value="อื่นๆ">📦 อื่นๆ</option>';
            }
        }

        async function addCat() {
            const n = document.getElementById('name').value; if(!n) return;
            const btn = document.getElementById('saveBtn'); btn.disabled = true; btn.innerText = "⏳ กำลังบันทึก...";
            try {
                await fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify({ action: 'add_category', data: { name: n, type: document.getElementById('type').value, parent: document.getElementById('acc').value, group: document.getElementById('group').value } }) });
                document.getElementById('name').value = ''; loadCats();
            } catch (e) { alert("ล้มเหลว"); }
            btn.disabled = false; btn.innerText = "เพิ่มหมวดหมู่ตอนนี้";
        }

        async function loadCats() {
            const res = await fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify({ action: 'get_categories' }) });
            const data = await res.json();
            if(data.status === 'success') {
                document.getElementById('list').innerHTML = data.categories.map(c => `<div class="bg-white p-3 rounded-2xl flex justify-between items-center shadow-sm border border-slate-50"><div class="text-xs"><b>${c.name}</b><br><span class="text-[9px] text-slate-300 uppercase">${c.parent} / ${c.group}</span></div><button onclick="updateStat('${c.id}')" class="text-rose-400 text-[9px] font-bold uppercase">ลบ</button></div>`).join('');
            }
        }
        async function updateStat(id) { if(confirm('ต้องการลบหมวดหมู่หรือไม่?')) { await fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify({ action: 'update_category_status', data: { id: id, status: 'Inactive' } }) }); loadCats(); } }
        window.onload = () => { updateGroups(); loadCats(); };
    </script>
</body>
</html>
