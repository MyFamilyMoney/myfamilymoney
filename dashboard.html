<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💰 แผงควบคุม - MyFamily Money</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>@import url('https://fonts.googleapis.com/css2?family=Kanit:wght@200;300;400;500;600;800&display=swap'); body { font-family: 'Kanit', sans-serif; background-color: #f8fafc; -webkit-font-smoothing: antialiased; }</style>
</head>
<body class="min-h-screen pb-10 text-slate-700">
    <div class="max-w-md mx-auto p-4 space-y-4">
        <div class="flex justify-between items-center bg-white p-4 rounded-[2.5rem] shadow-sm border border-slate-50">
            <div class="flex items-center gap-3">
                <img id="userImg" src="https://ui-avatars.com/api/?name=User" class="w-14 h-14 rounded-full border-2 border-slate-100 object-cover shadow-sm">
                <div><h2 id="userNameDisplay" class="font-semibold text-slate-800 text-base leading-tight">...</h2><button onclick="logout()" class="text-[9px] font-bold text-slate-300 uppercase">Sign Out</button></div>
            </div>
            <div class="flex flex-col gap-1.5">
                <div class="flex gap-1.5"><button onclick="exportReport()" class="text-[9px] font-bold text-emerald-600 bg-emerald-50 px-3 py-1.5 rounded-full">📄 รายงาน</button><button onclick="window.location.href='chat.html'" class="text-[9px] font-bold text-indigo-600 bg-indigo-50 px-3 py-1.5 rounded-full">💬 แชท</button></div>
                <div class="flex gap-1.5"><button onclick="window.location.href='reservoir.html'" class="text-[9px] font-bold text-amber-600 bg-amber-50 px-3 py-1.5 rounded-full">📥 รอจัดสรร</button><button onclick="window.location.href='manage_categories.html'" class="text-[9px] font-bold text-slate-500 bg-slate-100 px-3 py-1.5 rounded-full">⚙️ ตั้งค่า</button></div>
            </div>
        </div>

        <div class="bg-white rounded-[2.5rem] shadow-sm border border-slate-100 overflow-hidden">
            <div class="bg-slate-50/80 p-3 grid grid-cols-5 text-center gap-0.5 border-b border-slate-50 text-[7px] font-bold uppercase">
                <div><p class="text-yellow-600">📈 ลงทุน</p><p id="saveInvest">0</p></div>
                <div><p class="text-blue-600">🎓 ศึกษา</p><p id="saveEdu">0</p></div>
                <div><p class="text-emerald-600">🏥 สุขภาพ</p><p id="saveHealth">0</p></div>
                <div><p class="text-indigo-600">✈️ รางวัล</p><p id="saveReward">0</p></div>
                <div class="bg-emerald-100/30 rounded-lg text-emerald-700"><p>💰 รวม</p><p id="saveTotal">0</p></div>
            </div>
            <div class="p-10 text-center bg-white"><p class="text-[10px] text-slate-400 uppercase tracking-widest mb-1">กองกลางรวมคงเหลือ</p><h1 id="sharedCircular" class="text-4xl font-black text-slate-800">0 ฿</h1></div>
        </div>

        <div class="grid grid-cols-2 gap-3"><button onclick="window.location.href='add_transaction.html'" class="bg-white border-2 border-indigo-600 text-indigo-600 py-4 rounded-[2rem] font-bold">✚ บันทึกรายการ</button><button onclick="window.location.href='bucket_calculator.html'" class="bg-white border-2 border-blue-400 text-blue-500 py-4 rounded-[2rem] font-bold">🌀 วางแผนงบ</button></div>

        <div class="pt-4">
            <h3 class="font-bold text-slate-400 text-[10px] uppercase tracking-widest mb-5 text-center">ความเคลื่อนไหว (คนละ 15 รายการ)</h3>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <p class="text-[10px] font-black text-indigo-500 mb-2 ml-2">สมเจต</p>
                    <div class="bg-indigo-50/50 p-3 rounded-[1.5rem] mb-4 text-center border border-indigo-100 shadow-inner"><p class="text-[8px] font-bold text-indigo-300 uppercase">ยอดคงเหลือ</p><p id="u1Bal" class="text-lg font-black text-indigo-600">0 ฿</p></div>
                    <div id="u1Logs" class="space-y-2"></div>
                </div>
                <div>
                    <p class="text-[10px] font-black text-rose-500 mb-2 ml-2">รัชนี</p>
                    <div class="bg-rose-50/50 p-3 rounded-[1.5rem] mb-4 text-center border border-rose-100 shadow-inner"><p class="text-[8px] font-bold text-rose-300 uppercase">ยอดคงเหลือ</p><p id="u2Bal" class="text-lg font-black text-rose-600">0 ฿</p></div>
                    <div id="u2Logs" class="space-y-2"></div>
                </div>
            </div>
        </div>
    </div>
    <script>
        const WEB_APP_URL = "นhttps://script.google.com/macros/s/AKfycbzZps6Ze-HX8WqrIFufqP9QKYZ3-RJWU5chJCDqepI_qp84oqS9pmzm7b_mJzS_wYyV/exec"; // ⚠️ ต้องเป็น URL เดียวกับรหัส.gs
        const user = JSON.parse(localStorage.getItem('userData'));
        async function init() {
            if (!user) { window.location.href = 'index.html'; return; }
            document.getElementById('userNameDisplay').innerText = user.name;
            try {
                const res = await fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify({ action: 'get_dashboard_data', data: { userId: user.userId } }) });
                const data = await res.json();
                if (data.status === 'success') {
                    if (data.userPic) document.getElementById('userImg').src = data.userPic;
                    document.getElementById('saveInvest').innerText = data.savings.invest.toLocaleString();
                    document.getElementById('saveEdu').innerText = data.savings.edu.toLocaleString();
                    document.getElementById('saveHealth').innerText = data.savings.health.toLocaleString();
                    document.getElementById('saveReward').innerText = data.savings.reward.toLocaleString();
                    document.getElementById('saveTotal').innerText = data.savings.total.toLocaleString();
                    document.getElementById('sharedCircular').innerText = data.sharedCircular.toLocaleString() + " ฿";
                    document.getElementById('u1Bal').innerText = data.user1.balance.toLocaleString() + " ฿";
                    document.getElementById('u2Bal').innerText = data.user2.balance.toLocaleString() + " ฿";
                    const logH = (l) => `<div class="bg-white p-3 rounded-2xl shadow-sm border-l-2 ${l.amount > 0 ? 'border-indigo-400' : 'border-rose-400'}"><p class="text-[8px] font-bold text-slate-300 uppercase">${l.date}</p><p class="text-[10px] font-medium text-slate-700 truncate">${l.note}</p><p class="text-[11px] font-bold ${l.amount > 0 ? 'text-indigo-600' : 'text-rose-500'}">${l.amount.toLocaleString()}</p></div>`;
                    document.getElementById('u1Logs').innerHTML = data.user1.logs.map(logH).join('');
                    document.getElementById('u2Logs').innerHTML = data.user2.logs.map(logH).join('');
                }
            } catch (e) { console.error("Sync Error"); }
        }
        function logout() { localStorage.removeItem('userData'); window.location.href = 'index.html'; }
        window.onload = init;
    </script>
</body>
</html>
