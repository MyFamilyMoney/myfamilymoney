<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✚ บันทึกรายการ - MyFamily Money</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>@import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap'); body { font-family: 'Kanit', sans-serif; background-color: #f8fafc; } .btn-active { background-color: #1e293b !important; color: white !important; } .btn-inactive { background-color: white; color: #94a3b8; border-color: #f1f5f9; }</style>
</head>
<body class="min-h-screen pb-10 text-slate-700">
    <div class="max-w-md mx-auto p-4 space-y-4">
        <div class="flex items-center gap-3 mb-2"><button onclick="window.location.href='dashboard.html'" class="p-2 bg-white rounded-full shadow-sm text-slate-400 active:scale-90 transition">❮</button><h1 class="text-xl font-bold">✚ บันทึกรายการใหม่</h1></div>

        <div class="bg-white p-2 rounded-[2rem] shadow-sm grid grid-cols-3 gap-1 border border-slate-50">
            <button id="btnCirc" onclick="selectAcc('Circular')" class="py-4 rounded-[1.6rem] font-bold text-[10px] border btn-active">🔄 หมุนเวียน</button>
            <button id="btnSave" onclick="selectAcc('Savings')" class="py-4 rounded-[1.6rem] font-bold text-[10px] border btn-inactive">💰 เก็บออม</button>
            <button id="btnRes" onclick="selectAcc('Reservoir')" class="py-4 rounded-[1.6rem] font-bold text-[10px] border btn-inactive">📥 ถังพัก</button>
        </div>

        <div class="grid grid-cols-2 gap-3">
            <button id="typeInc" onclick="selectType('Income')" class="py-4 rounded-3xl font-bold text-sm border-2 border-emerald-500 text-emerald-600 bg-white">✚ รายรับ</button>
            <button id="typeExp" onclick="selectType('Expense')" class="py-4 rounded-3xl font-bold text-sm border-2 border-rose-500 bg-rose-500 text-white shadow-md">➖ รายจ่าย</button>
        </div>

        <div class="bg-white p-6 rounded-[2.5rem] shadow-sm space-y-4 border border-slate-50">
            <div id="catSection">
                <label class="text-[10px] font-bold text-slate-400 uppercase ml-2 tracking-widest">1. เลือกกลุ่มหมวดหมู่หลัก</label>
                <select id="mainGroup" onchange="filterSubCats()" class="w-full p-4 bg-slate-50 rounded-3xl border-none outline-none font-medium appearance-none shadow-inner"></select>
            </div>
            <div id="subCatSection">
                <label class="text-[10px] font-bold text-slate-400 uppercase ml-2 tracking-widest">2. เลือกรายการย่อย</label>
                <select id="catId" class="w-full p-4 bg-slate-50 rounded-3xl border-none outline-none font-medium appearance-none shadow-inner">
                    <option value="">-- กำลังโหลดรายการ... --</option>
                </select>
            </div>
            <div><label class="text-[10px] font-bold text-slate-400 uppercase ml-2 tracking-widest">3. จำนวนเงิน (บาท)</label><input type="number" id="amount" placeholder="0.00" class="w-full p-4 bg-slate-50 rounded-3xl border-none outline-none text-3xl font-bold text-slate-800"></div>
            <div><label class="text-[10px] font-bold text-slate-400 uppercase ml-2 tracking-widest">หมายเหตุ (ระบุที่มา/ที่ไป)</label><input type="text" id="note" placeholder="ระบุรายละเอียด..." class="w-full p-4 bg-slate-50 rounded-3xl border-none outline-none font-medium"></div>
            <button id="submitBtn" onclick="submitData()" class="w-full bg-indigo-600 text-white py-5 rounded-[2rem] font-bold text-lg shadow-xl active:scale-95 transition-all">บันทึกข้อมูลตอนนี้</button>
        </div>
    </div>

    <script>
        // ✅ ⚠️ เปลี่ยนเป็น URL Apps Script ของคุณ
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwS4cnZIW0Ntnnx7Qw4s50HY37YbsmeRcjpAFXZsj_5pkdoIZAqKY12lSGf27PW-eaUSA/exec";
        let currentAcc = 'Circular', currentType = 'Income', allCats = [];

        async function init() {
            try {
                const res = await fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify({ action: 'get_categories' }) });
                const data = await res.json();
                if(data.status === 'success') {
                    allCats = data.categories;
                    updateMainGroups();
                }
            } catch (e) { alert("โหลดข้อมูลขัดข้อง กรุณารีเฟรชหน้าจอ"); }
        }

        // ✅ ฟังก์ชันตัดอีโมจิและช่องว่างออกเพื่อการเปรียบเทียบที่แม่นยำ
        function clean(str) {
            if(!str) return "";
            return str.replace(/[\u2700-\u27BF]|[\uE000-\uF8FF]|\uD83C[\uDC00-\uDFFF]|\uD83D[\uDC00-\uDFFF]|[\u2011-\u26FF]|\uD83E[\uDD10-\uDDFF]/g, '').trim();
        }

        function updateMainGroups() {
            const mg = document.getElementById('mainGroup');
            if(currentAcc === 'Reservoir') { 
                document.getElementById('catSection').style.display = 'none'; 
                document.getElementById('subCatSection').style.display = 'none'; return; 
            }
            document.getElementById('catSection').style.display = 'block';
            document.getElementById('subCatSection').style.display = 'block';
            
            if(currentAcc === 'Savings') {
                mg.innerHTML = (currentType === 'Income') 
                    ? '<option value="ลงทุน">🏆 ลงทุน</option><option value="การศึกษา">🎓 การศึกษา</option><option value="สุขภาพ">🏥 สุขภาพ</option><option value="รางวัล">✈️ รางวัล</option>' 
                    : '<option value="ถอนลงทุน">📉 ถอนลงทุน</option><option value="จ่ายค่าเรียน">📚 จ่ายค่าเรียน</option><option value="จ่ายรักษาพยาบาล">🚑 จ่ายรักษาพยาบาล</option><option value="ใช้เงินรางวัล">🎁 ใช้เงินรางวัล</option>';
            } else {
                mg.innerHTML = (currentType === 'Income') 
                    ? '<option value="งบต้นเดือน">📈 งบต้นเดือน</option><option value="รายได้หลัก">💰 รายได้หลัก</option><option value="รายได้พิเศษ">🧧 รายได้พิเศษ</option><option value="อื่นๆ">📦 อื่นๆ</option>' 
                    : '<option value="ใช้จ่ายส่วนตัว">🛒 ใช้จ่ายส่วนตัว</option><option value="จ่ายฟิกซ์คอร์ส">📋 จ่ายฟิกซ์คอร์ส</option><option value="อื่นๆ">📦 อื่นๆ</option>';
            }
            filterSubCats();
        }

        function filterSubCats() {
            const groupValue = clean(document.getElementById('mainGroup').value);
            const sel = document.getElementById('catId');
            sel.innerHTML = '<option value="">-- เลือกรายการย่อย --</option>';
            
            // ✅ ใช้ฟังก์ชัน clean() ทั้งสองฝั่งเพื่อให้ข้อมูลแมตช์กันเสมอ
            const filtered = allCats.filter(c => 
                c.parent === currentAcc && 
                c.type === currentType && 
                clean(c.group) === groupValue
            );

            if(filtered.length === 0) {
                sel.innerHTML = '<option value="">(ไม่มีรายการย่อย)</option>';
            } else {
                filtered.forEach(c => { sel.innerHTML += `<option value="${c.id}">${c.name}</option>`; });
            }
        }

        function selectAcc(v) { 
            currentAcc = v; 
            ['btnCirc', 'btnSave', 'btnRes'].forEach(id => document.getElementById(id).className = "py-4 rounded-[1.6rem] font-bold text-[10px] border btn-inactive");
            document.getElementById(v==='Circular'?'btnCirc':v==='Savings'?'btnSave':'btnRes').className = "py-4 rounded-[1.6rem] font-bold text-[10px] border btn-active";
            updateMainGroups(); 
        }

        function selectType(v) { 
            currentType = v; 
            document.getElementById('typeInc').className = v === 'Income' ? "py-4 rounded-3xl font-bold text-sm border-2 border-emerald-500 bg-emerald-500 text-white shadow-md" : "py-4 rounded-3xl font-bold text-sm border-2 border-emerald-500 text-emerald-600 bg-white";
            document.getElementById('typeExp').className = v === 'Expense' ? "py-4 rounded-3xl font-bold text-sm border-2 border-rose-500 bg-rose-500 text-white shadow-md" : "py-4 rounded-3xl font-bold text-sm border-2 border-rose-500 text-rose-600 bg-white";
            updateMainGroups(); 
        }

        async function submitData() {
            const amount = document.getElementById('amount').value;
            if(!amount || (currentAcc !== 'Reservoir' && !document.getElementById('catId').value)) { alert("กรุณาระบุข้อมูลให้ครบถ้วน"); return; }
            const btn = document.getElementById('submitBtn'); btn.disabled = true; btn.innerText = "⏳ บันทึก...";
            try {
                await fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify({ action: 'add_transaction', data: { userId: JSON.parse(localStorage.getItem('userData')).userId, amount: currentType==='Expense' ? -amount : amount, catId: document.getElementById('catId').value, note: document.getElementById('note').value, accType: currentAcc } }) });
                window.location.href = 'dashboard.html';
            } catch (e) { alert("ล้มเหลว"); btn.disabled = false; btn.innerText = "บันทึกข้อมูลตอนนี้"; }
        }
        window.onload = init;
    </script>
</body>
</html>
