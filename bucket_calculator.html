<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌀 วางแผนงบประมาณ - MyFamily Money</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>@import url('https://fonts.googleapis.com/css2?family=Kanit:wght@200;300;400;500;600;700;800&display=swap'); body { font-family: 'Kanit', sans-serif; background-color: #f8fafc; } .group-card { border-radius: 2.5rem; overflow: hidden; background: white; border: 1px solid #e2e8f0; } .status-paid { color: #10b981 !important; font-weight: 800; opacity: 0.6; text-decoration: line-through; } .item-row { cursor: pointer; padding: 8px 0; border-bottom: 1px solid #f8fafc; }</style>
</head>
<body class="min-h-screen p-4 pb-12 text-slate-800">
    <div class="max-w-md mx-auto space-y-6">
        <div class="bg-white p-8 rounded-[2.5rem] shadow-sm text-center border border-slate-100 shadow-indigo-100/50">
            <h1 class="text-2xl font-bold text-indigo-600 mb-6">วางแผนงบประมาณ</h1>
            <input type="number" id="incomeInput" oninput="runPlanning()" placeholder="ใส่รายได้รวมทั้งหมด ฿" 
                class="w-full p-5 bg-slate-50 border-2 border-slate-50 rounded-[1.5rem] text-3xl font-bold text-center outline-none focus:border-indigo-500 transition-all shadow-inner">
            <p class="text-[9px] text-slate-400 mt-4 uppercase">แตะที่ชื่อรายการเพื่อยืนยันการชำระเงิน</p>
        </div>

        <div class="group-card shadow-sm border-l-8 border-blue-500">
            <div class="p-6 pb-2"><h3 class="text-xs font-bold text-blue-600 mb-4 uppercase">รายการส่วนที่ 1 (หักลบรายจ่าย)</h3><div id="details1" class="space-y-1 text-sm"></div></div>
            <div class="bg-blue-50/50 p-4 text-center border-t border-blue-50"><p id="total1" class="text-2xl font-bold text-blue-600">0 ฿</p></div>
        </div>

        <div class="group-card shadow-sm border-l-8 border-rose-500">
            <div class="p-6 pb-2"><h3 class="text-xs font-bold text-rose-600 mb-4 uppercase">รายการส่วนที่ 2 (หักลบรายจ่าย)</h3><div id="details2" class="space-y-1 text-sm"></div></div>
            <div class="bg-rose-50/50 p-4 text-center border-t border-rose-50"><p id="total2" class="text-2xl font-bold text-rose-600">0 ฿</p></div>
        </div>

        <div id="resultSection" class="hidden animate-fade-in space-y-4">
            <div class="bg-white p-6 rounded-[2rem] border-2 border-rose-100 text-center"><p class="text-[10px] font-bold text-rose-400 uppercase mb-1">รวมยอดที่ยังไม่ได้จ่ายทั้งหมด</p><h2 id="totalAllExpenses" class="text-3xl font-black text-rose-500">0 ฿</h2></div>
            <div class="bg-slate-800 p-8 rounded-[2.5rem] text-white text-center shadow-xl"><p class="text-[10px] font-bold uppercase opacity-60 mb-2">ยอดคงเหลือ (ตัวตั้ง 100%)</p><h2 id="balanceInitial" class="text-4xl font-black">0 ฿</h2></div>
            <div class="bg-white p-8 rounded-[2.5rem] shadow-sm border border-slate-100">
                <div class="relative w-52 h-52 mx-auto mb-10"><canvas id="planningChart"></canvas></div>
                <div class="grid grid-cols-1 gap-2.5 text-xs font-bold">
                    <div class="flex justify-between p-3.5 bg-amber-50 text-amber-700 rounded-2xl"><span>📈 ลงทุน (60%)</span><span id="valInvest">0</span></div>
                    <div class="flex justify-between p-3.5 bg-blue-50 text-blue-700 rounded-2xl"><span>🎓 การศึกษา (15%)</span><span id="valEdu">0</span></div>
                    <div class="flex justify-between p-3.5 bg-emerald-50 text-emerald-700 rounded-2xl"><span>🏥 สุขภาพ (15%)</span><span id="valHealth">0</span></div>
                    <div class="flex justify-between p-3.5 bg-indigo-50 text-indigo-700 rounded-2xl"><span>✈️ รางวัล (10%)</span><span id="valReward">0</span></div>
                </div>
            </div>
        </div>
    </div>
    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycby9wGATELSDvY7phy2CwDZsGtF4-BbxfSZPSzxU70nGiUPzP9TNnith4QVlRztcQQ4LXg/exec"; 
        let configData = [], chart;
        async function init() {
            try {
                const res = await fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify({ action: 'get_bucket_config' }) });
                const data = await res.json();
                if (data.status === 'success') { configData = data.config.circle1.concat(data.config.circle2); renderFixedSections(); }
            } catch (e) {}
        }
        function renderFixedSections() {
            let h1 = "", h2 = "", t1 = 0, t2 = 0;
            configData.forEach(item => {
                const isPaid = (item.status === 'Paid');
                const row = `<div class="flex justify-between items-center item-row ${isPaid ? 'status-paid' : 'font-medium'}" onclick="toggleStatus('${item.name}', '${item.status}')"><span>${item.name}</span><span class="font-bold">${item.value.toLocaleString()}</span></div>`;
                if (item.name.startsWith("1.")) { h1 += row; if(!isPaid) t1 += item.value; }
                else if (item.name.startsWith("2.")) { h2 += row; if(!isPaid) t2 += item.value; }
            });
            document.getElementById('details1').innerHTML = h1; document.getElementById('details2').innerHTML = h2;
            document.getElementById('total1').innerText = t1.toLocaleString() + " ฿"; document.getElementById('total2').innerText = t2.toLocaleString() + " ฿";
            runPlanning();
        }
        async function toggleStatus(name, currentStatus) {
            const newStatus = currentStatus === 'Paid' ? 'Unpaid' : 'Paid';
            const item = configData.find(i => i.name === name); if(item) item.status = newStatus; renderFixedSections();
            try { fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify({ action: 'update_item_status', data: { itemName: name, newStatus: newStatus } }) }); } catch (e) {}
        }
        function runPlanning() {
            const inc = parseFloat(document.getElementById('incomeInput').value) || 0;
            const t1_all = configData.filter(i => i.name.startsWith("1.")).reduce((a, b) => a + b.value, 0);
            const t2_all = configData.filter(i => i.name.startsWith("2.")).reduce((a, b) => a + b.value, 0);
            const t1_rem = configData.filter(i => i.name.startsWith("1.") && i.status !== 'Paid').reduce((a, b) => a + b.value, 0);
            const t2_rem = configData.filter(i => i.name.startsWith("2.") && i.status !== 'Paid').reduce((a, b) => a + b.value, 0);
            const initialBalance = inc - t1_all - t2_all;
            if (inc > 0) {
                document.getElementById('resultSection').classList.remove('hidden');
                document.getElementById('totalAllExpenses').innerText = (t1_rem + t2_rem).toLocaleString() + " ฿";
                document.getElementById('balanceInitial').innerText = initialBalance.toLocaleString(undefined, {minimumFractionDigits: 2}) + " ฿";
                const unit = initialBalance / 100;
                const vals = [unit * 60, unit * 15, unit * 15, unit * 10];
                document.getElementById('valInvest').innerText = vals[0].toLocaleString(undefined, {minimumFractionDigits: 2});
                document.getElementById('valEdu').innerText = vals[1].toLocaleString(undefined, {minimumFractionDigits: 2});
                document.getElementById('valHealth').innerText = vals[2].toLocaleString(undefined, {minimumFractionDigits: 2});
                document.getElementById('valReward').innerText = vals[3].toLocaleString(undefined, {minimumFractionDigits: 2});
                updateChart(vals);
            } else { document.getElementById('resultSection').classList.add('hidden'); }
        }
        function updateChart(dataValues) {
            const ctx = document.getElementById('planningChart').getContext('2d'); if (chart) chart.destroy();
            chart = new Chart(ctx, { type: 'doughnut', data: { labels: ['ลงทุน', 'ศึกษา', 'สุขภาพ', 'รางวัล'], datasets: [{ data: dataValues, backgroundColor: ['#f59e0b', '#3b82f6', '#10b981', '#6366f1'], borderWidth: 0 }] }, options: { cutout: '80%', plugins: { legend: { display: false } } } });
        }
        window.onload = init;
    </script>
</body>
</html>
